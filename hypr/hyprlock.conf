general {
	fail_timeout = 1000
}

input-field {
	size = 700,75
	dots_rounding = -1
	rounding = 10
	inner_color = rgb(000000)
	font_color = rgb(ffffff)
	outer_color = rgb(ffffff)
	outline_thickness = 1

	fail_color = rgb(525252)
	
	fail_text = Are you $USER?
	placeholder_text = 
	font_family = monospace
	check_color = rgb(7a2828)
	check_text = Uhh....
		
	valign = "bottom"

	fade_timeout = 1000

	position = 0,100
}

label {
	font_family = monospace
	valign = "top"
	text = $TIME
	position = 0,800
	font_size = 90

	shadow_passes = 1
	shadow_size = 4
}

background {
	blur_size = 2
	blur_passes = 4
	#path = ~/Pictures/wallpapers/gray_weather.webp
	color = rgb(0,0,0)
}
